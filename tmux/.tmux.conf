# 新しい上下ペインを、現在のペインと同じディレクトリで開く
bind '"' split-window -v -c "#{pane_current_path}"

# 新しい左右ペインを、現在のペインと同じディレクトリで開く
bind % split-window -h -c "#{pane_current_path}"

# 新しいウィンドウも、現在のディレクトリで開く
bind c new-window -c "#{pane_current_path}"

# prefix を Ctrl-j のみに（Ctrl-b は無効）
set -g prefix C-k
unbind C-b
bind C-k send-prefix

# マウス操作可能に
set -g mouse on

# ホイールの速さ
bind -T copy-mode    WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode    WheelDownPane select-pane \; send-keys -X -N 1 scroll-down

bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down

# ペイン移動を vim 風に（-r で prefix を押し直さず連打できる）
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# prefix+l を潰すので、直前のウィンドウは prefix+Space に退避
bind Space last-window

# ペインのリサイズも vim 風に（大文字）
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 右に追加：verticalな境界線を作る
bind m split-window -h -c "#{pane_current_path}"

# 下に追加：belowに追加
bind n split-window -v -c "#{pane_current_path}"

# 右に追加して、全体をタイル状に再配置（バグあり？）
# bind m split-window -h -c "#{pane_current_path}" \; select-layout tiled

# 下に追加して、全体をタイル状に再配置
# bind n split-window -v -c "#{pane_current_path}" \; select-layout tiled



# ===== クリップボード (OSC 52) =====
# コピー内容を OSC 52 で外側の端末へ送る。ssh 越し・tmux ネストでも手元のクリップボードに届く
# on: 内側の tmux やアプリからの OSC 52 も受け取って外側へ中継する（external だと中継しない）
set -g set-clipboard on

# 外側の端末が OSC 52 に対応していると tmux に教える
# 内側の tmux から見た外側は TERM=tmux-256color なので tmux* / screen* も明示する
set -as terminal-features ',xterm*:clipboard,tmux*:clipboard,screen*:clipboard'

# vi コピーモードで v で選択開始、y でコピー（pbcopy は使わない。リモートで呼ぶと手元に届かないため）
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel


# ===== テーマ =====
# True Color を有効化（テーマの色を正しく表示するため）
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# 使うテーマ: catppuccin
# 中身は ~/.config/tmux/themes/<名前>.conf
# 切り替え後は tmux を一度すべて終了して起動し直す（source だと前のテーマの設定が残る）
set -g @theme "catppuccin"
source-file -F "~/.config/tmux/themes/#{@theme}.conf"
