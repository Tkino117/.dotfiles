# catppuccin: https://github.com/catppuccin/tmux

# プラグイン本体が無ければ自動で clone（新しい環境向け）
if-shell "test ! -d ~/.config/tmux/plugins/catppuccin/tmux" \
    "run-shell 'git clone -q -b v2.3.2 --depth 1 https://github.com/catppuccin/tmux.git ~/.config/tmux/plugins/catppuccin/tmux'"

set -g @catppuccin_flavor "mocha"                 # latte, frappe, macchiato, mocha
set -g @catppuccin_window_status_style "rounded"
# ウィンドウ一覧にはウィンドウ名（#W）を表示（デフォルトはペインタイトル #T）
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# ステータスライン（catppuccin.tmux の読み込み後に設定する）
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
